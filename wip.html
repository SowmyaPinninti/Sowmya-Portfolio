<!DOCTYPE html>

    <meta charset="UTF-8">

    ```
    <title>Case Study - Work in Progress</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
        }

        .case-study-wip {
            position: relative;
            width: 80%;
            max-width: 800px;
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 50px 30px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            background: rgba(255,255,255,0.03);
        }

        .wip-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
            text-align: center;
        }

        .wip-status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 22px;
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 600;
            opacity: 0.65;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: white;
            animation: wipPulse 1.8s ease-in-out infinite;
        }

        .wip-content h3 {
            margin: 0 0 16px;
            font-size: 28px;
            font-weight: 500;
        }

        .wip-content p {
            margin: 0 auto;
            max-width: 540px;
            line-height: 1.8;
            font-size: 15px;
            opacity: 0.65;
        }

        .wip-note {
            margin-top: 22px;
            font-size: 13px;
            opacity: 0.45;
        }

        .wip-orbit {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 50%;
            animation: wipRotate 12s linear infinite;
        }

            .wip-orbit span {
                position: absolute;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: white;
            }

                .wip-orbit span:nth-child(1) {
                    top: -3px;
                    left: 50%;
                }

                .wip-orbit span:nth-child(2) {
                    right: 15px;
                    bottom: 45px;
                }

                .wip-orbit span:nth-child(3) {
                    left: 15px;
                    bottom: 45px;
                }

        @keyframes wipRotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes wipPulse {

            0%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        @media (max-width: 600px) {

            .case-study-wip {
                width: 75%;
                min-height: 300px;
                padding: 40px 22px;
            }

            .wip-content h3 {
                font-size: 23px;
            }

            .wip-content p {
                font-size: 14px;
            }

            .wip-orbit {
                width: 210px;
                height: 210px;
            }
        }
    </style>
    ```

</head>
